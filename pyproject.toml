[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "living-objects"
version = "0.3.0"
description = "Evidence-first, bounded genetic-programming research tools"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Living Objects Research", email = "research@livingobjects.dev"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["agents", "ai", "objects", "persistence", "memory", "reasoning", "research"]

dependencies = []

[project.scripts]
living-objects = "living_objects.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
llm = [
    "litellm>=1.0",
    "openai>=1.0",
]
all = [
    "living-objects[dev,llm]",
]
production = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.8,<3.0",
    "prometheus-client>=0.20,<1.0",
    "redis>=5.0,<7.0",
    "uvicorn[standard]>=0.30,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "websockets>=13.0,<16.0",
]
test = [
    "httpx>=0.27,<1.0",
    "pytest-asyncio>=0.24,<2.0",
]

[project.urls]
Homepage = "https://github.com/rajdeep09-dev/living-objects"
Documentation = "https://github.com/rajdeep09-dev/living-objects#readme"
Repository = "https://github.com/rajdeep09-dev/living-objects"
Issues = "https://github.com/rajdeep09-dev/living-objects/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["living_objects*", "production*", "evolution*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests", "production", "evolution"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
