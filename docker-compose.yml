services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: dev
      DATABASE_URL: sqlite:///./state/living_objects.sqlite3
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: compose-only-change-me
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000
      ORGANISM_LIMIT: 10000
    volumes:
      - living_objects_state:/app/state
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    deploy:
      replicas: 3
      update_config:
        order: start-first
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - living_objects_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
    retries: 10

  sandbox-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "production/sandbox_worker.py"]
    read_only: true
    network_mode: "none"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    mem_limit: 64m
    cpus: 0.25
    stdin_open: true
    tty: false

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./production/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./production/monitoring/alerts.yaml:/etc/prometheus/alerts.yaml:ro
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - living_objects_grafana:/var/lib/grafana
      - ./production/monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/living-objects.json:ro
    ports:
      - "3001:3000"

volumes:
  living_objects_state:
  living_objects_redis:
  living_objects_grafana:
