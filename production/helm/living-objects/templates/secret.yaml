{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "living-objects.fullname" . }}-secrets
  labels:
    {{- include "living-objects.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required unless secrets.existingSecret is set" .Values.secrets.jwtSecret | quote }}
  DATABASE_URL: {{ .Values.database.url | quote }}
  REDIS_URL: {{ .Values.redis.url | quote }}
{{- end }}

