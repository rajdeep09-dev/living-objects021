{{- if .Values.substrate.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "living-objects.fullname" . }}-substrate-v4
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "living-objects.name" . }}
      app.kubernetes.io/component: substrate-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "living-objects.name" . }}
        app.kubernetes.io/component: substrate-worker
        {{- if .Values.universeIsolation.enabled }}
        {{ .Values.universeIsolation.namespaceLabel }}: isolated
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: substrate-worker
          image: "{{ .Values.substrate.image.repository }}:{{ .Values.substrate.image.tag }}"
          command: ["python", "production/substrate_worker.py"]
          stdin: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.substrate.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
{{- end }}
