apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: living-objects-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: living-objects-api
  minReplicas: 3
  maxReplicas: 32
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: living_objects_organisms
        target:
          type: AverageValue
          averageValue: "2500"

