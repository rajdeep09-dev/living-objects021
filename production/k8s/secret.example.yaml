apiVersion: v1
kind: Secret
metadata:
  name: living-objects-secrets
type: Opaque
stringData:
  JWT_SECRET: replace-with-a-long-random-secret
  DATABASE_URL: postgresql://living:replace-me@postgres:5432/living_objects
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: https://living-objects.example.com

